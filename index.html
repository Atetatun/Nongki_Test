<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nongkrong Yuk!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark;
--navy:#0a1e46;--navy2:#0c2658;--blue:#12377f;--btn:#12347c;--gold:#ffd23f;--ease:cubic-bezier(.2,.9,.3,1.25);
--disp:"Lilita One","Poppins",system-ui,sans-serif;--lab:"Poppins",system-ui,sans-serif;--body:"Montserrat",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;color:#fff;font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
background:linear-gradient(180deg,#d9d9d9 0,#173f93 30%,#12377f 100%)}
body[data-s=form]{background:linear-gradient(180deg,#8aa3d6 0,#153a85 26%,#12377f 100%)}
body[data-s=room]{background:linear-gradient(180deg,#7f99cf 0,#254a96 224px,#0a1e46 224px)}
#app{flex:1;width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}
footer{background:var(--navy2);border-top:1px solid rgba(255,255,255,.25);height:72px;display:grid;place-items:center;font:600 13px var(--body);text-align:center;padding:0 12px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 25px 40px}
h1,h2{margin:0;font-weight:400}
.logo{font:400 44px/1 var(--disp);position:relative;letter-spacing:.01em;white-space:nowrap;animation:drop .8s var(--ease) both}
.logo .bar{position:absolute;left:0;top:-9px;height:5px;border-radius:3px;background:#fff;width:62%;transform-origin:left;animation:grow .7s .5s cubic-bezier(.2,.8,.2,1) both}
.eyes{position:absolute;right:-4px;top:-22px;display:flex;gap:3px}
.eye{width:15px;height:19px;background:#fff;border-radius:50%;display:grid;place-items:center;animation:blink 5.5s infinite}
.eye b{width:7px;height:9px;background:#111;border-radius:50%;transition:transform .08s}
.tag{margin:12px 0 0;font-size:15px;animation:rise .6s .3s both}
.pill{display:inline-grid;place-items:center;font:400 26px var(--disp);width:240px;height:46px;border-radius:23px;background:#fff;color:var(--blue);text-decoration:none;border:0;cursor:pointer;margin-top:66px;animation:rise .6s .45s both,pulse 2.6s 1.4s infinite;transition:transform .2s var(--ease)}
.pill:hover{transform:translateY(-3px) scale(1.03)}.pill:active{transform:scale(.95)}
.lnk{margin-top:22px;color:#fff;font:600 14px var(--lab);opacity:.85;animation:rise .6s .6s both}
.card{margin:auto 25px;width:calc(100% - 50px);align-self:center;background:var(--navy);border-radius:28px;padding:34px 22px 30px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:enter .6s var(--ease) both}
.wrapc{flex:1;display:flex;padding:60px 0 40px}
.card h1{font:400 38px/1 var(--disp);text-align:center;letter-spacing:.03em}
.sub{text-align:center;margin:12px 6px 26px;font-size:13px}
label,.lb{display:block;font:700 15px var(--lab);margin:0 0 10px}
.in{width:100%;height:50px;border-radius:25px;border:0;background:#fff;color:#333;font:600 14px var(--lab);padding:0 24px}
.in::placeholder{color:#555;opacity:1}
.in:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chibis{display:grid;grid-template-columns:repeat(3,66px);justify-content:space-between;gap:18px 0;padding:0 14px;margin:14px 0 24px}
.cb{width:66px;height:66px;border-radius:50%;background:#fff;border:0;padding:11px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .2s}
.cb:hover{transform:translateY(-4px)}
.cb[aria-pressed=true]{box-shadow:0 0 0 4px var(--gold);animation:pop .45s var(--ease)}
.cb svg,.av svg{width:100%;height:100%;display:block}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:6px 0 22px}
.dates label{font-size:12.5px;margin-bottom:8px}
.dt{width:100%;height:44px;border-radius:14px;border:0;background:#fff;color:#333;font:600 13px var(--lab);text-align:center;color-scheme:light}
.go{width:100%;height:50px;border-radius:25px;border:0;background:var(--btn);color:#fff;font:400 24px var(--disp);cursor:pointer;transition:transform .2s var(--ease),background .2s}
.go:hover{background:#1a46a0;transform:translateY(-2px)}.go:active{transform:scale(.96)}.go:disabled{opacity:.6}
.err{min-height:1.3em;color:#ff9a8f;font-size:12.5px;margin:-12px 0 10px;text-align:center}
.hist{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.hist a{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;text-decoration:none;background:var(--btn);border-radius:16px;padding:12px 16px;transition:transform .2s var(--ease)}
.hist a:hover{transform:translateX(4px)}
.hist b{display:block;font:600 14px var(--lab)}.hist small{opacity:.75}
.rh{height:224px;padding:18px 0 0}
.rh h2{font:500 19px var(--body);padding:0 24px 14px}
.mem{display:flex;gap:16px;overflow-x:auto;padding:0 20px 8px;scrollbar-width:none}
.mem::-webkit-scrollbar{display:none}
.m{flex:0 0 76px;text-align:center;background:none;border:0;color:#fff;padding:0;cursor:pointer;font:inherit;animation:pop .55s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.av{width:76px;height:76px;border-radius:50%;background:#fff;padding:13px;margin-bottom:6px;display:grid;place-items:center;color:var(--blue);font:400 34px var(--disp)}
.m.me .av{box-shadow:0 0 0 4px var(--gold)}
.inv .av{background:transparent;border:2px dashed rgba(255,255,255,.7);color:#fff}
.m b{display:block;font:700 13px var(--lab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m small{display:block;font-size:10.5px;opacity:.9}
.rp{flex:1;padding:22px 20px 36px;animation:rise .5s .15s both}
.rp h1{font:400 28px/1.1 var(--disp)}
.rp .mut{opacity:.7;font-size:12.5px;margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:18px 0 6px;background:rgba(255,255,255,.07);padding:5px;border-radius:999px}
.tabs button{height:40px;border:0;border-radius:999px;background:transparent;color:#fff;font:400 18px var(--disp);cursor:pointer;transition:background .25s,color .25s}
.tabs button[aria-selected=true]{background:#fff;color:var(--blue)}
.hint{font-size:12.5px;opacity:.75;margin:12px 0 4px}
.gw{overflow-x:auto;margin-top:10px}
.grid{display:grid;gap:3px}
.gh{text-align:center;font-size:11px;line-height:1.2;opacity:.8;padding-bottom:4px}.gh b{display:block;font:700 13px var(--lab);opacity:1}
.gt{font-size:11px;text-align:right;padding-right:6px;align-self:center;opacity:.7}
.c{height:36px;border-radius:9px;background:rgba(255,255,255,.09);display:grid;place-items:center;font:700 12px var(--lab);user-select:none;-webkit-user-select:none;transition:background .15s,transform .15s var(--ease)}
.grid.isi .c{touch-action:none;cursor:pointer}
.c.on{background:#fff;color:var(--blue);transform:scale(1.06)}
.picks{display:grid;gap:8px;margin:12px 0 18px}
.pick{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.08);animation:enter .5s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
.pick:first-child{background:var(--gold);color:#3a2a00}
.pick .n{font:400 30px var(--disp);min-width:1.6ch;text-align:center}
.pick small{display:block;opacity:.8}
.rp h3{margin:18px 0 0;font:400 20px var(--disp)}
.leg{display:flex;align-items:center;gap:8px;font-size:11.5px;opacity:.8;margin-top:10px}
.leg i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.09),#6db3ff)}
.empty{border:1.5px dashed rgba(255,255,255,.3);border-radius:14px;padding:14px;font-size:13px;opacity:.85}
.sec{margin-top:14px;background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;font:600 13px var(--lab);height:42px;border-radius:21px;width:100%;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:var(--blue);padding:10px 18px;border-radius:999px;font:600 13px var(--lab);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}60%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app,footer{position:relative;z-index:1}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.c.s-g{background:#3ddc84;color:#05331a}.c.s-y{background:#ffd23f;color:#3a2a00}.c.s-r{background:#ff5c5c;color:#fff}
.c.s-g,.c.s-y,.c.s-r{transform:scale(1.05);animation:pop .3s var(--ease)}
.c.rx{box-shadow:inset 0 0 0 2px #ff5c5c}
.lg{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.lg span{font:600 12px var(--lab);padding:5px 12px;border-radius:999px}
.ivb{margin-top:16px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07)}
.invr{display:flex;gap:8px;margin:8px 0 6px}.in.sm{height:42px;font-size:12px;padding:0 16px}.go.sm{width:92px;height:42px;font-size:18px}
.detail{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.7}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px 4px 4px;font:600 12px var(--lab)}.chip i{width:26px;height:26px;border-radius:50%;background:#fff;padding:3px;display:block}.chip svg{width:100%;height:100%;display:block}
.exp{margin-top:22px;padding:16px;border-radius:20px;background:rgba(255,255,255,.07)}.exp h3{margin:0}.expg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.expg .go{font-size:16px;height:46px}
</style>
</head>
<body data-s="landing">
<main id="app"></main>
<footer>@2026 Nongkrong Yuk! - by Mahasiswasigma</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var JAM=[];for(var h=10;h<=23;h++)JAM.push(h);
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var PAL={k:'#2b2230',w:'#fff',g:'#cfd6e0',d:'#7d8794',b:'#6f8db0',B:'#3d5878',o:'#f08a24',y:'#f6c244',n:'#c98b4e',p:'#f4a6b8',r:'#e56b5b'};
var ART={
cat:'..k......k../.kwk....kwk./.kwwkkkkwwk./kwwwwwwwwwwk/kwwkwwwwkwwk/kwwwwppwwwwk/.kwwwwwwwwk./.kwwwwwwwwkk/.kwwwwwwwwwk/.kwwwwwwwwwk/.kwwkkkkwwk./..kk....kk..',
shark:'............/.......B..../......BbB.../...BbbbbbB.B/.BbbbbbbbbBB/BbbkbbbbbbB./Bbbbbbbbbb../BwwwbbbbbBB./.wrwwwbbbB.B/..wwwbbB..../............',
penguin:'....kkkk..../...kkkkkk.../..kkwkkwkk../..kkkookkk../.kkkkkkkkkk./.kkwwwwwwkk./kkkwwwwwwkkk/kkkwwwwwwkkk/.kkwwwwwwkk./..kwwwwwwk../..kkkkkkkk../...oo..oo...',
hamster:'..nn....nn../.nnnnnnnnnn./nnnnnnnnnnnn/nnknnnnnnknn/nwwwnppnwwwn/nwwwwwwwwwwn/.nwwwwwwwwn./.nwwwwwwwwn./.nnwwwwwwnn./..nnnnnnnn../..nn....nn..',
husky:'.d........d./.dd......dd./.dddddddddd./dddddddddddd/ddwwddddwwdd/ddwkwddwkwdd/dwwwwwwwwwwd/.wwwwkkwwww./..wwwwwwww../...wwwwww...',
owl:'.n........n./.nn......nn./.nnnnnnnnnn./nnwwwnnwwwnn/nwwkwwwwkwwn/nwwwwwwwwwwn/nnwwwyywwwnn/nnnnnyynnnnn/nnwnnnnnnwnn/nnwwnnnnwwnn/.nnwwwwwwnn./..yy....yy..'};
var TIPE=['cat','shark','penguin','hamster','husky','owl'],NAMA={cat:'Kucing',shark:'Hiu',penguin:'Pinguin',hamster:'Hamster',husky:'Husky',owl:'Burung hantu'};
function chibi(t){var g=ART[t].split('/');function at(y,x){return (g[y]&&g[y][x])||'.'}
  var s='<svg viewBox="-1 -1 14 14" shape-rendering="crispEdges" aria-hidden="true">';
  for(var y=-1;y<=12;y++)for(var x=-1;x<=12;x++){var c=at(y,x),f=null;
    if(c!=='.')f=PAL[c];else if(at(y-1,x)!=='.'||at(y+1,x)!=='.'||at(y,x-1)!=='.'||at(y,x+1)!=='.')f=PAL.k;
    if(f)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>'}
  return s+'</svg>'}
var mem={},okS=true;
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){okS=false;return mem[k]!==undefined?mem[k]:d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){okS=false;mem[k]=v}}
var ev=load('nk_ev',{}),hist=load('nk_hist',[]),me=load('nk_me',{}),draft={},sel=new Set(),drag=true,tt;
function persist(){save('nk_ev',ev);save('nk_hist',hist);save('nk_me',me)}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dt(s){return new Date(s+'T00:00')}
function rng(d){var a=dt(d[0]),b=dt(d[d.length-1]),f=function(x){return x.getDate()+'/'+(x.getMonth()+1)};return d.length>1?f(a)+' – '+f(b):f(a)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}
function view(html,s){document.body.dataset.s=s;$('#app').innerHTML=html;window.scrollTo(0,0)}

function landing(){
  var n=hist.filter(function(i){return ev[i]}).length;
  view('<section class="center"><h1 class="logo" aria-label="Nongkrong Yuk!"><span class="bar"></span><span class="eyes" aria-hidden="true"><i class="eye"><b></b></i><i class="eye"><b></b></i></span>Nongkrong Yuk!</h1>'+
  '<p class="tag">Solusi untuk waktu Gabutmu!</p><a class="pill" href="#mulai">Mulai!</a>'+(n?'<a class="lnk" href="#acara">Acara Saya ('+n+')</a>':'')+'</section>','landing');
}
function identity(kind,id){
  var own=kind==='owner',c=draft.c||'';
  view('<div class="wrapc"><section class="card"><h1>'+(own?'INISIATOR':'PESERTA')+'</h1>'+
  '<p class="sub">Masukkan namamu dan pilih chibi favoritmu!</p>'+
  '<label for="nm">Masukkan Namamu</label><input class="in" id="nm" maxlength="16" placeholder="Contoh: Bubub Imuppp" autocomplete="off" value="'+esc(draft.name||'')+'">'+
  '<div class="lb" style="margin-top:22px">Pilih Karakter Chibimu!</div><div class="chibis" role="group" aria-label="Pilih karakter">'+
  TIPE.map(function(t){return '<button type="button" class="cb" data-t="'+t+'" aria-label="'+NAMA[t]+'" aria-pressed="'+(t===c)+'">'+chibi(t)+'</button>'}).join('')+'</div>'+
  '<div class="err" id="er" role="alert"></div><button class="go" id="ok">'+(own?'Lanjut':'Gabung')+'</button></section></div>','form');
  document.querySelectorAll('.cb').forEach(function(b){b.onclick=function(){c=b.dataset.t;document.querySelectorAll('.cb').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
  $('#ok').onclick=function(){
    var n=$('#nm').value.trim();
    if(!n){$('#er').textContent='Isi namamu dulu ya.';$('#nm').focus();return}
    if(!c){$('#er').textContent='Pilih satu chibi dulu.';return}
    if(own){draft={name:n,c:c};location.hash='buat';return}
    var e=ev[id];
    if(Object.keys(e.people).some(function(k){return k.toLowerCase()===n.toLowerCase()})){$('#er').textContent='Nama itu sudah dipakai. Pakai nama lain.';return}
    e.people[n]={c:c,s:[]};me[id]=n;persist();room(id);
  };
}
function buat(){
  if(!draft.name){location.hash='mulai';return}
  var t=new Date(),e=new Date();e.setDate(e.getDate()+2);
  view('<div class="wrapc"><section class="card"><h1>INISIATOR</h1><p class="sub">Masukkan namamu, nama kegiatan dan<br>tentuin kapan Tanggalnya!</p>'+
  '<label for="jd">Masukkan Judul Kegiatan</label><input class="in" id="jd" maxlength="40" placeholder="Contoh : Arisan Maknya" autocomplete="off">'+
  '<div class="dates" style="margin-top:22px"><div><label for="d1">Mulai Tanggal</label><input class="dt" type="date" id="d1" value="'+iso(t)+'"></div><div><label for="d2">Tanggal Selesai</label><input class="dt" type="date" id="d2" value="'+iso(e)+'"></div></div>'+
  '<div class="err" id="er" role="alert"></div><button class="go" id="ok">Buat Room</button></section></div>','form');
  $('#ok').onclick=function(){
    var jd=$('#jd').value.trim(),a=$('#d1').value,b=$('#d2').value;
    if(!jd){$('#er').textContent='Isi judul kegiatan dulu ya.';$('#jd').focus();return}
    if(!a||!b){$('#er').textContent='Pilih tanggal mulai dan selesai.';return}
    if(b<a){$('#er').textContent='Tanggal selesai harus setelah tanggal mulai.';return}
    var days=[],d=dt(a);while(iso(d)<=b&&days.length<8){days.push(iso(d));d.setDate(d.getDate()+1)}
    if(days.length>7){$('#er').textContent='Maksimal 7 hari supaya tabel tetap muat.';return}
    var id='room-'+Math.random().toString(36).slice(2,8),p={};p[draft.name]={c:draft.c,s:[]};
    ev[id]={name:jd,days:days,owner:draft.name,people:p};hist.unshift(id);me[id]=draft.name;persist();location.hash=id;
  };
}
function acara(){
  var items=hist.filter(function(i){return ev[i]}).map(function(i){var e=ev[i];return '<li><a href="#'+i+'"><span><b>'+esc(e.name)+'</b><small>'+rng(e.days)+'</small></span><span>'+Object.keys(e.people).length+' orang</span></a></li>'}).join('');
  view('<div class="wrapc"><section class="card"><h1>ACARA SAYA</h1><p class="sub">Semua tautan yang pernah kamu buat ada di sini.</p>'+
  (items?'<ul class="hist">'+items+'</ul>':'<div class="empty">Belum ada acara. Buat satu dulu, nanti tersimpan otomatis di sini.</div>')+
  (okS?'':'<div class="empty" style="margin-top:12px">Browser ini tidak bisa menyimpan riwayat (mode privat?). Salin tautan setelah room dibuat.</div>')+
  '<a class="pill" style="width:100%;margin-top:22px;animation:none;font-size:22px;height:48px" href="#">Kembali</a></section></div>','form');
}
function counts(e){var c={};Object.keys(e.people).forEach(function(n){e.people[n].s.forEach(function(k){c[k]=(c[k]||0)+1})});return c}
function room(id){
  var e=ev[id];
  if(!e){view('<div class="wrapc"><section class="card"><h1>OOPS</h1><p class="sub">Tautan ini tidak ada di browser ini. Minta pembuat room mengirim ulang tautannya, atau buat room baru.</p><a class="pill" style="width:100%;margin-top:6px;animation:none;font-size:22px;height:48px" href="#">Ke beranda</a></section></div>','form');return}
  var u=me[id];if(!u||!e.people[u]){draft={};identity('join',id);return}
  sel=new Set(e.people[u].s);
  var names=Object.keys(e.people);
  view('<div class="rh"><h2>Room</h2><div class="mem">'+names.map(function(n,i){var p=e.people[n];
    return '<div class="m'+(n===u?' me':'')+'" style="--i:'+i+'"><div class="av">'+chibi(p.c)+'</div><b>'+esc(n)+'</b><small>'+(n===e.owner?'Pembuat Room':'Anggota')+'</small></div>'}).join('')+
    '<button class="m inv" id="inv" style="--i:'+names.length+'"><div class="av">+</div><b>Undang</b><small>Salin tautan</small></button></div></div>'+

        $('#er').textContent='Gagal membuat acara: ' + err.message;
